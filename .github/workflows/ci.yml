name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Audit dependencies
      run: npm audit --audit-level=moderate
      
    - name: Type check
      run: npm run lint
      
    - name: Build Application
      run: npm run build

    - name: Smoke test production server
      run: |
        NODE_ENV=production PORT=4173 npm start &
        SERVER_PID=$!
        sleep 5
        curl --fail http://127.0.0.1:4173/api/health
        kill $SERVER_PID

    - name: Upload production artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: node-production-build
        path: dist
        retention-days: 14
